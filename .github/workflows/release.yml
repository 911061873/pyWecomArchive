name: 检查、构建和发布

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  test:
    name: Python ${{ matrix.python }} 测试
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  build:
    name: 构建 ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win_amd64
          - os: ubuntu-24.04
            platform: linux_x86_64
          - os: ubuntu-24.04-arm
            platform: linux_aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked --group linux
      - run: uv run --no-sync python scripts/inspect_elf.py
      - name: 检查 Linux ELF 依赖和符号版本
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for lib in src/pywecomarchive/lib/linux/*/*.so; do
            readelf -d "$lib"
            readelf --version-info "$lib"
          done
      - run: uv build --wheel
      - name: 修复 Linux wheel
        if: runner.os == 'Linux'
        run: uv run --no-sync python scripts/repair_linux.py
      - name: 收集 Windows wheel
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force wheelhouse
          Copy-Item dist/*.whl wheelhouse/
      - run: uv run --no-sync python scripts/verify_wheel.py 'wheelhouse/*.whl'
      - run: uv run --no-sync twine check --strict wheelhouse/*
      - name: 在独立环境安装并加载原生 SDK
        shell: bash
        run: |
          uv venv .venv-smoke --python 3.12
          if [ "$RUNNER_OS" = "Windows" ]; then
            smoke_python=.venv-smoke/Scripts/python.exe
          else
            smoke_python=.venv-smoke/bin/python
          fi
          uv pip install --python "$smoke_python" wheelhouse/*.whl
          "$smoke_python" -X utf8 -I scripts/smoke_native.py
          uv pip install --python "$smoke_python" pytest
          "$smoke_python" -X utf8 -I -m pytest tests
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  testpypi:
    name: 发布 TestPyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/pywecomarchive
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 检查版本及许可条件
        run: python scripts/check_release.py
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - name: 确认三个平台产物齐全
        run: |
          python -c "from pathlib import Path; p=list(Path('dist').glob('*.whl')); assert len(p)==3, p; assert all(any(t in f.name for f in p) for t in ('win_amd64', 'x86_64', 'aarch64')), p"
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  verify-testpypi:
    name: 从 TestPyPI 安装验证 ${{ matrix.platform }}
    needs: testpypi
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win_amd64
          - os: ubuntu-24.04
            platform: linux_x86_64
          - os: ubuntu-24.04-arm
            platform: linux_aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: wheel-${{ matrix.platform }}
          path: expected
      - name: 下载 TestPyPI wheel 并核对构建产物哈希
        run: uv run --no-project --python 3.12 python scripts/download_testpypi.py
      - name: 独立安装和运行测试
        shell: bash
        run: |
          uv venv .venv-index --python 3.12
          if [ "$RUNNER_OS" = "Windows" ]; then
            index_python=.venv-index/Scripts/python.exe
          else
            index_python=.venv-index/bin/python
          fi
          uv pip install --python "$index_python" --index-url https://pypi.org/simple test-wheel/*.whl pytest
          "$index_python" -X utf8 -I scripts/smoke_native.py
          "$index_python" -X utf8 -I -m pytest tests
